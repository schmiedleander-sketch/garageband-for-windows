<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1e14" />
      <stop offset="50%" stop-color="#191311" />
      <stop offset="100%" stop-color="#0e0a08" />
    </linearGradient>
    <linearGradient id="guitarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="35%" stop-color="#e64a19" />
      <stop offset="70%" stop-color="#b71c1c" />
      <stop offset="100%" stop-color="#3e0707" />
    </linearGradient>
    <radialGradient id="sunburst" cx="55%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ff9800" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#d84315" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#260404" />
    </radialGradient>
    <linearGradient id="pickguard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7ccc8" />
      <stop offset="50%" stop-color="#bcaaa4" />
      <stop offset="100%" stop-color="#8d6e63" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background (Windows / Fluent aesthetic) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#3e2e28" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle glow rings in the background mimicking soundwaves / amp speaker -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ff9800" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffb74d" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Iconic GarageBand Electric Guitar (Diagonal Gibson / Fender style) -->
  <g transform="rotate(-36 256 256)">
    <!-- Guitar Body (Classic sunburst cutaway) -->
    <path d="M 190 140
             C 170 120, 150 140, 130 180
             C 110 220, 115 270, 140 310
             C 165 350, 175 400, 210 430
             C 250 460, 310 450, 340 400
             C 370 350, 360 300, 345 260
             C 335 230, 345 190, 320 150
             C 300 120, 275 140, 260 160
             Z"
          fill="url(#sunburst)" stroke="#1a0505" stroke-width="8" filter="url(#shadow)"/>

    <!-- Guitar Pickguard -->
    <path d="M 210 210
             C 210 210, 175 250, 185 300
             C 195 350, 240 360, 250 330
             C 260 300, 255 240, 240 220 Z"
          fill="url(#pickguard)" opacity="0.9" stroke="#9ca3af" stroke-width="2"/>

    <!-- Sound pickups -->
    <rect x="220" y="240" width="60" height="18" rx="5" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
    <circle cx="230" cy="249" r="3" fill="#e5e7eb"/>
    <circle cx="242" cy="249" r="3" fill="#e5e7eb"/>
    <circle cx="254" cy="249" r="3" fill="#e5e7eb"/>
    <circle cx="266" cy="249" r="3" fill="#e5e7eb"/>

    <rect x="222" y="275" width="60" height="18" rx="5" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
    <circle cx="232" cy="284" r="3" fill="#e5e7eb"/>
    <circle cx="244" cy="284" r="3" fill="#e5e7eb"/>
    <circle cx="256" cy="284" r="3" fill="#e5e7eb"/>
    <circle cx="268" cy="284" r="3" fill="#e5e7eb"/>

    <!-- Bridge & Tailpiece -->
    <rect x="225" y="325" width="55" height="14" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <rect x="230" y="350" width="45" height="8" rx="2" fill="#9ca3af"/>

    <!-- Control knobs -->
    <circle cx="280" cy="380" r="10" fill="#e0a96d" stroke="#5d4037" stroke-width="2"/>
    <circle cx="310" cy="355" r="10" fill="#e0a96d" stroke="#5d4037" stroke-width="2"/>

    <!-- Neck -->
    <rect x="238" y="-40" width="28" height="200" fill="url(#neckGrad)" stroke="#3e2723" stroke-width="3"/>

    <!-- Frets -->
    <line x1="238" y1="-20" x2="266" y2="-20" stroke="#ffd54f" stroke-width="2"/>
    <line x1="238" y1="10" x2="266" y2="10" stroke="#ffd54f" stroke-width="2"/>
    <line x1="238" y1="40" x2="266" y2="40" stroke="#ffd54f" stroke-width="2"/>
    <line x1="238" y1="70" x2="266" y2="70" stroke="#ffd54f" stroke-width="2"/>
    <line x1="238" y1="100" x2="266" y2="100" stroke="#ffd54f" stroke-width="2"/>
    <line x1="238" y1="130" x2="266" y2="130" stroke="#ffd54f" stroke-width="2"/>

    <!-- Headstock -->
    <path d="M 238 -40 L 230 -110 C 235 -125, 265 -130, 275 -115 L 266 -40 Z" fill="#3e2723" stroke="#21130d" stroke-width="3"/>

    <!-- Tuning Pegs -->
    <circle cx="222" cy="-95" r="5" fill="#f3f4f6"/>
    <circle cx="224" cy="-75" r="5" fill="#f3f4f6"/>
    <circle cx="226" cy="-55" r="5" fill="#f3f4f6"/>
    <circle cx="278" cy="-95" r="5" fill="#f3f4f6"/>
    <circle cx="276" cy="-75" r="5" fill="#f3f4f6"/>
    <circle cx="274" cy="-55" r="5" fill="#f3f4f6"/>

    <!-- Strings with shine -->
    <line x1="243" y1="-100" x2="243" y2="330" stroke="#f3f4f6" stroke-width="1.8" opacity="0.9"/>
    <line x1="247" y1="-100" x2="247" y2="330" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <line x1="251" y1="-100" x2="251" y2="330" stroke="#ffffff" stroke-width="1.3" opacity="0.9"/>
    <line x1="255" y1="-100" x2="255" y2="330" stroke="#f3f4f6" stroke-width="1.2" opacity="0.85"/>
    <line x1="259" y1="-100" x2="259" y2="330" stroke="#f3f4f6" stroke-width="1.0" opacity="0.8"/>
  </g>

  <!-- Musical notes sparkling around guitar -->
  <text x="375" y="160" font-family="Segoe UI, sans-serif" font-size="44" fill="#ffb74d" opacity="0.85" filter="url(#glow)">♪</text>
  <text x="80" y="390" font-family="Segoe UI, sans-serif" font-size="38" fill="#ffa726" opacity="0.8" filter="url(#glow)">♫</text>
  <text x="85" y="150" font-family="Segoe UI, sans-serif" font-size="32" fill="#ffcc80" opacity="0.75" filter="url(#glow)">♩</text>
</svg>